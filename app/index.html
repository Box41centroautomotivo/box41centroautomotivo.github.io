<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OficinaControl">
  <meta name="theme-color" content="#111111">
  <title>OficinaControl</title>
  <link rel="apple-touch-icon" href="icone.png">
  <link rel="icon" href="icone.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
    #carregando { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #eee; font-family: -apple-system, system-ui, sans-serif; gap: 16px; text-align: center; padding: 24px; }
    #carregando img { width: 120px; }
  </style>
</head>
<body>
  <div id="carregando">
    <img src="logo.png" alt="">
    <div id="msg">Carregando o OficinaControl...</div>
  </div>
  <script>
    // Kotlin/Wasm precisa de WebAssembly com coleta de lixo (Safari 18.2+ / iOS 18.2+, Chrome 119+).
    (function () {
      var ok = typeof WebAssembly === 'object' && WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,95,1,120,0]));
      if (!ok) {
        document.getElementById('msg').innerHTML = 'Este navegador é antigo para o OficinaControl.<br>No iPhone, atualize o iOS (Ajustes › Geral › Atualização de Software) e abra de novo no Safari.';
        return;
      }
      var s = document.createElement('script'); s.src = 'oficina.js?v=5.17'; document.body.appendChild(s);
    })();
  </script>
</body>
</html>
