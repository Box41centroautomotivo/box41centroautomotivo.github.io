<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OficinaControl">
  <meta name="theme-color" content="#111111">
  <title>OficinaControl</title>
  <link rel="apple-touch-icon" href="icone.png">
  <link rel="icon" href="icone.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
    #carregando { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #eee; font-family: -apple-system, system-ui, sans-serif; gap: 16px; text-align: center; padding: 24px; }
    #carregando img { width: 120px; }
  </style>
</head>
<body>
  <div id="carregando">
    <img src="logo.png" alt="">
    <div id="msg">Carregando o OficinaControl...</div>
  </div>
  <script>
    // Versão desta página (trocada na publicação). O Safari e o app na tela inicial do iPhone guardam a página antiga:
    // ao abrir, confere a versão publicada (sem cache) e, se saiu outra, recarrega com a nova.
    var VERSAO = '5.25';
    function mostrar(t) { var m = document.getElementById('msg'); if (m) m.innerHTML = t; }
    // Se o app não carregar, mostra o motivo em vez de ficar parado em "Carregando".
    window.addEventListener('error', function (e) {
      if (document.getElementById('carregando')) mostrar('Não foi possível abrir o OficinaControl.<br><small>' + (e.message || e) + '</small><br><br>Feche e abra de novo. Se continuar, avise o suporte com esta mensagem.');
    });
    window.addEventListener('unhandledrejection', function (e) {
      if (document.getElementById('carregando')) mostrar('Não foi possível abrir o OficinaControl.<br><small>' + ((e.reason && e.reason.message) || e.reason) + '</small><br><br>Feche e abra de novo. Se continuar, avise o suporte com esta mensagem.');
    });
    (function () {
      try {
        fetch('versao.txt?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (v) {
          v = (v || '').trim();
          if (v && VERSAO.indexOf('__') !== 0 && v !== VERSAO && location.search.indexOf('v=' + v) < 0) location.replace('./?v=' + v);
        }).catch(function () {});
      } catch (e) {}
    })();
    // Kotlin/Wasm precisa de WebAssembly com coleta de lixo (Safari 18.2+ / iOS 18.2+, Chrome 119+).
    (function () {
      var ok = typeof WebAssembly === 'object' && WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,95,1,120,0]));
      if (!ok) {
        mostrar('Este navegador é antigo para o OficinaControl.<br>No iPhone, atualize o iOS (Ajustes › Geral › Atualização de Software) e abra de novo no Safari.');
        return;
      }
      var s = document.createElement('script'); s.src = 'oficina.js?v=' + VERSAO; document.body.appendChild(s);
    })();
  </script>
</body>
</html>
