<style>
  :root {
    --fundo: #121212; --cartao: #1c1c1c; --cartao2: #262321; --borda: #3d3935;
    --texto: #ece6e0; --suave: #b9b0a7; --laranja: #fc6b03; --amarelo: #efef05;
    --verde: #34c27a; --vermelho: #ff6e66; --azul: #7fb2ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fundo); color: var(--texto);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .topo { background: #0b0b0b; border-bottom: 3px solid var(--laranja); }
  .topo .faixa { max-width: 1000px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
  .topo img { width: 56px; height: 56px; border-radius: 50%; flex: none; }
  .topo h1 { margin: 0; font-size: 1.15rem; letter-spacing: .02em; }
  .topo p { margin: 0; color: var(--suave); font-size: .82rem; }
  main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 48px; }
  .cartao { background: var(--cartao); border: 1px solid var(--borda); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  h2 { font-size: 1.2rem; margin: 0 0 10px; }
  .meta { color: var(--suave); font-size: .92rem; margin: 2px 0 0; }
  .dados { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px 18px; margin: 0; }
  .dados div { min-width: 0; }
  .dados dt { color: var(--suave); font-size: .8rem; }
  .dados dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  .bloco { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--borda); }
  .bloco b { display: block; color: var(--suave); font-size: .8rem; font-weight: 600; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 0; }
  .principal { width: 100%; margin-top: 18px; padding: 14px; background: var(--laranja); color: #000; font-weight: 700; font-size: 1.05rem; }
  .principal:disabled { opacity: .6; cursor: not-allowed; }
  .secundario { padding: 9px 14px; background: var(--cartao2); color: var(--texto); border: 1px solid var(--borda); }
  .rapido { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  /* Tabela no computador (como no OficinaSystem); no celular cada linha vira um cartão. */
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th { text-align: left; color: var(--suave); font-weight: 600; font-size: .8rem; padding: 8px 6px; border-bottom: 2px solid var(--borda); }
  td { padding: 10px 6px; border-bottom: 1px solid var(--borda); vertical-align: top; }
  td.n, th.n { text-align: right; white-space: nowrap; }
  .nome { font-weight: 600; }
  .tipo { color: var(--suave); font-size: .8rem; }
  tfoot td { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--borda); }
  .riscado .nome, .riscado td.n { text-decoration: line-through; color: var(--suave); }
  .normal-riscado { text-decoration: line-through; color: var(--suave); font-weight: 400; margin-right: 6px; }
  .etiqueta { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; color: #000; white-space: nowrap; }
  .e-pend { background: var(--amarelo); } .e-cli { background: var(--verde); } .e-ofi { background: var(--azul); } .e-rec { background: var(--vermelho); }
  .escolha { display: flex; gap: 6px; margin-top: 6px; }
  .escolha button { flex: 1; padding: 8px 10px; background: var(--cartao2); color: var(--texto); border: 1px solid var(--borda); font-weight: 600; min-width: 90px; }
  .escolha button.sim[aria-pressed="true"] { background: var(--verde); border-color: var(--verde); color: #000; }
  .escolha button.nao[aria-pressed="true"] { background: var(--vermelho); border-color: var(--vermelho); color: #000; }
  .escolha button:focus-visible { outline: 2px solid var(--laranja); outline-offset: 2px; }
  .linha { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
  .total { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 700; margin-top: 10px; padding-top: 10px; border-top: 2px solid var(--borda); }
  .total span:last-child { color: var(--laranja); }
  textarea { width: 100%; min-height: 70px; margin-top: 8px; padding: 10px; border-radius: 10px; border: 1px solid var(--borda);
    background: var(--cartao2); color: var(--texto); font: inherit; }
  .erro { color: var(--vermelho); margin: 12px 0 0; }
  .ok { background: rgba(52,194,122,.12); border-left: 3px solid var(--verde); padding: 10px 12px; border-radius: 6px; margin: 0 0 16px; }
  footer { text-align: center; color: var(--suave); font-size: .85rem; padding: 0 16px 32px; }
  @media (max-width: 759px) {
    thead { display: none; }
    table, tbody, tfoot, tr, td { display: block; width: 100%; }
    tr { border-bottom: 1px solid var(--borda); padding: 10px 0; }
    td { border: 0; padding: 2px 0; }
    td.n { text-align: left; display: flex; justify-content: space-between; }
    td.n::before { content: attr(data-rotulo); color: var(--suave); font-weight: 400; }
    td.num::before { content: none; }
    td.num { color: var(--suave); font-size: .8rem; }
    td.status { margin-top: 6px; }
    tfoot tr { border: 0; }
    tfoot td.vazio { display: none; }
  }
  @media print {
    :root { --fundo: #fff; --cartao: #fff; --cartao2: #fff; --borda: #999; --texto: #000; --suave: #444; }
    .topo { background: #fff; } .escolha, .rapido, .principal, #motivo-bloco, footer, .nao-imprimir { display: none !important; }
    .cartao { border: 0; padding: 0; }
  }
</style>
</head>

<main>
  <div id="carregando" class="cartao">Carregando os itens da sua OS…</div>
  <div id="conteudo" hidden></div>
</main>
<footer>Dúvidas sobre algum item? Fale com a oficina pelo WhatsApp antes de responder.</footer>

<script>
const VERSAO_PAGINA = "aprovar 5.33";
const SUPABASE = "https://sgzcsdsdjuspcdaxxggb.supabase.co";
const CHAVE = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNnemNzZHNkanVzcGNkYXh4Z2diIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NjI0MTUsImV4cCI6MjEwODQzODQxNX0.0LobydfLKEfC9XZdBGOIN88ycAapcEosOxLHa3rz1Yg";
const $ = (id) => document.getElementById(id);
const reais = (v) => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const qtd = (v) => Number(v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 3, maximumFractionDigits: 3 });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dataBr = (s) => { if (!s) return ""; const [d, h] = String(s).replace("T", " ").split(" "); const [a, m, di] = d.split("-"); return `${di}/${m}/${a}` + (h ? " " + h.slice(0, 5) : ""); };
const token = new URLSearchParams(location.search).get("t") || "";
let dados = null, resposta = {};

async function rpc(funcao, corpo) {
  const r = await fetch(`${SUPABASE}/rest/v1/rpc/${funcao}`, {
    method: "POST",
    headers: { apikey: CHAVE, Authorization: `Bearer ${CHAVE}`, "Content-Type": "application/json" },
    body: JSON.stringify(corpo),
  });
  if (!r.ok) throw new Error("Não foi possível falar com a oficina agora. Tente de novo em instantes.");
  return r.status === 204 ? {} : r.json();
}

// Log de erros (Supabase, tabela erro_app): grava se a página quebrar no celular do cliente.
let reportados = 0;
function reportar(msg) {
  if (++reportados > 5) return;
  rpc("registrar_erro", { p: { versao: VERSAO_PAGINA, plataforma: "web: " + navigator.userAgent, tela: "Aprovação do cliente", mensagem: String(msg).slice(0, 900) } }).catch(() => {});
}
window.addEventListener("error", (e) => reportar("Erro: " + (e.message || e)));

function erro(msg) {
  $("carregando").hidden = false;
  $("carregando").innerHTML = `<h2>Não foi possível abrir</h2><p class="erro">${esc(msg)}</p>`;
  $("conteudo").hidden = true;
}

// Banco ainda sem os campos novos (5.33): monta as linhas a partir dos campos antigos.
function normalizar(d) {
  if (Array.isArray(d.linhas) && d.totais) return d;
  const linhas = (d.itens || []).map((i) => ({
    id: i.id, tipo: i.tipo, descricao: i.descricao, quantidade: i.quantidade, unitario: i.valor, bruto: i.subtotal, desconto: 0,
    liquido: i.subtotal, situacao: i.situacao || "normal", valor_normal: null,
    status: i.aprovacao === "pendente" ? "pendente" : "aprovado_oficina",
  })).concat((d.recusados || []).map((r, k) => ({
    id: "r" + k, tipo: "", descricao: r.descricao, quantidade: 1, unitario: r.subtotal, bruto: r.subtotal, desconto: 0, liquido: r.subtotal,
    situacao: "normal", status: "recusado",
  })));
  const ativos = linhas.filter((l) => l.status !== "recusado");
  const soma = (lst, c) => lst.reduce((s, l) => s + Number(l[c] || 0), 0);
  d.linhas = linhas;
  d.totais = {
    itens: linhas.length, aprovados: linhas.filter((l) => l.status.startsWith("aprovado")).length,
    pendentes: linhas.filter((l) => l.status === "pendente").length, recusados: linhas.filter((l) => l.status === "recusado").length,
    bruto: soma(ativos, "bruto"), desconto_itens: 0, liquido: soma(ativos, "liquido"),
    ja_aprovado: soma(linhas.filter((l) => l.status.startsWith("aprovado")), "liquido"),
    aguardando: soma(linhas.filter((l) => l.status === "pendente"), "liquido"), desconto_os: d.desconto || 0, total: d.total,
  };
  d.etapa = d.etapa || ""; d.cliente_nome = d.cliente_nome || d.cliente || "";
  return d;
}

function etiqueta(l) {
  switch (l.status) {
    case "pendente": return `<span class="etiqueta e-pend">Aguardando sua resposta</span>`;
    case "aprovado_cliente": return `<span class="etiqueta e-cli">Aprovado por você</span>`;
    case "aprovado_oficina": return `<span class="etiqueta e-ofi">Aprovado pela oficina</span>`;
    default: return `<span class="etiqueta e-rec">Recusado</span>`;
  }
}

function linhaTabela(l, n) {
  const pend = l.status === "pendente" && dados.pode_aprovar;
  const naoQuer = pend && resposta[l.id] === false;
  const gratis = l.situacao && l.situacao !== "normal";
  const rotuloGratis = l.situacao === "garantia" ? "Garantia" : "Cortesia";
  const liquido = gratis
    ? `${l.valor_normal ? `<span class="normal-riscado">${reais(l.valor_normal)}</span>` : ""}${rotuloGratis} ${reais(0)}`
    : reais(l.liquido);
  return `<tr class="${l.status === "recusado" || naoQuer ? "riscado" : ""}">
    <td class="num">#${n}</td>
    <td><div class="nome">${esc(l.descricao)}</div><div class="tipo">${l.tipo === "S" ? "Serviço" : l.tipo === "P" ? "Produto" : ""}</div></td>
    <td class="n" data-rotulo="Quantidade">${qtd(l.quantidade)}</td>
    <td class="n" data-rotulo="Valor unitário">${reais(l.unitario)}</td>
    <td class="n" data-rotulo="Valor bruto">${reais(l.bruto)}</td>
    <td class="n" data-rotulo="Desconto">- ${reais(l.desconto)}</td>
    <td class="n" data-rotulo="Valor líquido"><b>${liquido}</b></td>
    <td class="status">${etiqueta(l)}
      ${pend ? `<div class="escolha" role="group" aria-label="Resposta para ${esc(l.descricao)}">
        <button type="button" class="sim" aria-pressed="${resposta[l.id] === true}" data-id="${l.id}" data-v="1">Aprovo</button>
        <button type="button" class="nao" aria-pressed="${resposta[l.id] === false}" data-id="${l.id}" data-v="0">Não quero</button>
      </div>` : ""}</td>
  </tr>`;
}

function mostrar(msg) {
  $("carregando").hidden = true;
  const c = $("conteudo");
  c.hidden = false;
  const t = dados.totais, of = dados.oficina_info || {}, carro = dados.carro || {};
  const pend = dados.pode_aprovar ? dados.linhas.filter((l) => l.status === "pendente") : [];
  const faltam = pend.filter((l) => resposta[l.id] === undefined).length;
  const escolhidoSim = pend.filter((l) => resposta[l.id] === true).reduce((s, l) => s + Number(l.liquido), 0);
  const algumNao = pend.some((l) => resposta[l.id] === false);
  const comEscolhas = Math.max(0, Number(t.ja_aprovado) + escolhidoSim - Number(t.desconto_os || 0));
  if (of.nome) $("oficina-nome").textContent = of.nome;
  $("oficina-info").textContent = [of.endereco, of.cnpj && "CNPJ " + of.cnpj, of.telefone].filter(Boolean).join(" · ") || "Aprovação do orçamento";
  const anos = [carro.ano, carro.ano_fabricacao].filter((a) => a).join(" | ");
  c.innerHTML = `
    ${msg ? `<div class="ok" role="status">${esc(msg)}</div>` : ""}
    <section class="cartao">
      <h2>Ordem de Serviço Nº ${dados.numero}${dados.etapa ? " · " + esc(dados.etapa) : ""}</h2>
      <dl class="dados">
        ${dados.cliente_nome ? `<div><dt>Cliente</dt><dd>${esc(dados.cliente_nome)}</dd></div>` : ""}
        ${carro.placa || dados.veiculo ? `<div><dt>Veículo</dt><dd>${esc(carro.placa ? [carro.placa, [carro.marca, carro.modelo].filter(Boolean).join(" ")].filter(Boolean).join(" - ") : dados.veiculo)}</dd></div>` : ""}
        ${anos ? `<div><dt>Ano modelo | fabricação</dt><dd>${esc(anos)}</dd></div>` : ""}
        ${dados.aberta_em ? `<div><dt>Data de abertura</dt><dd>${dataBr(dados.aberta_em)}</dd></div>` : ""}
        ${dados.km ? `<div><dt>Km na entrada</dt><dd>${Number(dados.km).toLocaleString("pt-BR")} km</dd></div>` : ""}
        ${dados.km_saida ? `<div><dt>Km na saída</dt><dd>${Number(dados.km_saida).toLocaleString("pt-BR")} km</dd></div>` : ""}
      </dl>
      ${dados.defeito ? `<div class="bloco"><b>Defeito apresentado</b>${esc(dados.defeito)}</div>` : ""}
      ${dados.recusa_motivo ? `<div class="bloco"><b>Motivo da recusa do cliente</b>${esc(dados.recusa_motivo)}</div>` : ""}
    </section>

    <section class="cartao">
      <h2>Itens do orçamento</h2>
      ${!dados.pode_aprovar ? `<p class="erro">Esta OS já foi encerrada; não é mais possível responder por aqui.</p>`
        : pend.length ? `<p class="meta">Toque em <b>Aprovo</b> ou <b>Não quero</b> em cada item e depois em <b>Enviar resposta</b>.</p>
          <div class="rapido"><button type="button" class="secundario" id="todos">Aprovar todos</button></div>`
        : `<p class="meta">Todos os itens já foram respondidos. Obrigado!</p>`}
      <table>
        <thead><tr><th>#</th><th>Item</th><th class="n">Quantidade</th><th class="n">Valor unitário</th><th class="n">Valor bruto</th>
          <th class="n">Desconto</th><th class="n">Valor líquido</th><th>Status</th></tr></thead>
        <tbody>${dados.linhas.map((l, i) => linhaTabela(l, i + 1)).join("")}</tbody>
        <tfoot><tr>
          <td class="vazio"></td><td>Total de itens ${t.itens}</td><td class="vazio"></td><td class="vazio"></td>
          <td class="n" data-rotulo="Valor bruto">${reais(t.bruto)}</td>
          <td class="n" data-rotulo="Desconto">- ${reais(t.desconto_itens)}</td>
          <td class="n" data-rotulo="Valor líquido">${reais(t.liquido)}</td>
          <td>${t.aprovados}/${t.itens} aprovados</td>
        </tr></tfoot>
      </table>
    </section>

    <section class="cartao">
      <h2>Quanto vai ficar</h2>
      ${t.aguardando > 0 && dados.pode_aprovar ? `
        <div class="linha"><span>Já aprovado</span><span>${reais(t.ja_aprovado)}</span></div>
        <div class="linha"><span>Esperando sua resposta</span><span>${reais(t.aguardando)}</span></div>
        ${Number(t.desconto_os) > 0 ? `<div class="linha"><span>Desconto da OS</span><span>- ${reais(t.desconto_os)}</span></div>` : ""}
        <div class="total"><span>${faltam ? "Se aprovar tudo, vai ficar" : "Com suas escolhas, vai ficar"}</span>
          <span>${reais(faltam ? Math.max(0, Number(t.ja_aprovado) + Number(t.aguardando) - Number(t.desconto_os || 0)) : comEscolhas)}</span></div>`
      : `
        ${Number(t.desconto_os) > 0 ? `<div class="linha"><span>Itens</span><span>${reais(t.liquido)}</span></div>
          <div class="linha"><span>Desconto da OS</span><span>- ${reais(t.desconto_os)}</span></div>` : ""}
        <div class="total"><span>Total da OS</span><span>${reais(t.total)}</span></div>`}
      ${pend.length ? `
        <div id="motivo-bloco" ${algumNao ? "" : "hidden"}>
          <p class="meta" style="margin-top:14px">Quer contar por que não aprovou? (opcional)</p>
          <textarea id="motivo" maxlength="500" placeholder="Ex.: vou fazer depois, achei caro, já troquei essa peça…"></textarea>
        </div>
        <button type="button" class="principal" id="enviar" ${faltam ? "disabled" : ""}>
          ${faltam ? `Responda ${faltam === 1 ? "1 item" : faltam + " itens"} para enviar` : "Enviar resposta"}</button>
        <p class="erro" id="erro-envio" role="alert"></p>` : ""}
      <div class="rapido nao-imprimir"><button type="button" class="secundario" id="imprimir">Imprimir</button></div>
    </section>`;
  const motivoAntes = window.__motivo || "";
  if ($("motivo")) { $("motivo").value = motivoAntes; $("motivo").addEventListener("input", (e) => (window.__motivo = e.target.value)); }
  c.querySelectorAll(".escolha button").forEach((b) => b.addEventListener("click", () => {
    resposta[b.dataset.id] = b.dataset.v === "1";
    mostrar();
  }));
  const todos = $("todos");
  if (todos) todos.addEventListener("click", () => { pend.forEach((l) => (resposta[l.id] = true)); mostrar(); });
  const enviar = $("enviar");
  if (enviar && !faltam) enviar.addEventListener("click", enviarResposta);
  $("imprimir").addEventListener("click", () => window.print());
}

async function enviarResposta() {
  const b = $("enviar");
  b.disabled = true;
  b.textContent = "Enviando…";
  const pend = dados.linhas.filter((l) => l.status === "pendente");
  const motivo = (window.__motivo || "").trim();
  try {
    const recusados = pend.filter((l) => resposta[l.id] === false).map((l) => l.id);
    const r = await rpc("portal_aprovar", {
      p_token: token,
      p_aprovados: pend.filter((l) => resposta[l.id] === true).map((l) => l.id),
      p_recusados: recusados,
    });
    if (r.erro) throw new Error(r.erro);
    if (recusados.length && motivo) {
      try { await rpc("portal_motivo_recusa", { p_token: token, p_motivo: motivo }); } catch (e) { reportar("Motivo da recusa: " + e.message); }
    }
    const atual = await rpc("portal_itens", { p_token: token });
    dados = normalizar(atual.erro ? r : atual);
    resposta = {}; window.__motivo = "";
    mostrar("Resposta enviada! A oficina já recebeu e vai seguir com os itens aprovados.");
    window.scrollTo(0, 0);
  } catch (e) {
    b.disabled = false;
    b.textContent = "Enviar resposta";
    $("erro-envio").textContent = e.message;
  }
}

(async () => {
  if (!/^[0-9a-f-]{36}$/i.test(token)) return erro("Link incompleto. Abra de novo o link que a oficina mandou pelo WhatsApp.");
  try {
    const r = await rpc("portal_itens", { p_token: token });
    if (r.erro) return erro(r.erro);
    dados = normalizar(r);
    mostrar();
  } catch (e) { reportar("Abrir: " + e.message); erro(e.message); }
})();
</script>
</body>
</html>
