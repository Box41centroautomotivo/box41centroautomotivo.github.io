<style>
  :root {
    --fundo: #121212; --cartao: #1c1c1c; --cartao2: #262321; --borda: #3d3935;
    --texto: #ece6e0; --suave: #b9b0a7; --laranja: #fc6b03; --amarelo: #efef05;
    --verde: #34c27a; --vermelho: #ff6e66;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fundo); color: var(--texto);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .topo { background: #0b0b0b; border-bottom: 3px solid var(--laranja); }
  .topo .faixa { max-width: 760px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
  .topo img { width: 56px; height: 56px; border-radius: 50%; }
  .topo h1 { margin: 0; font-size: 1.15rem; letter-spacing: .02em; }
  .topo p { margin: 0; color: var(--suave); font-size: .9rem; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  .cartao { background: var(--cartao); border: 1px solid var(--borda); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  h2 { font-size: 1.25rem; margin: 0 0 6px; }
  h3 { font-size: 1rem; margin: 18px 0 4px; color: var(--suave); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .meta { color: var(--suave); font-size: .92rem; margin: 2px 0 0; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 0; }
  .principal { width: 100%; margin-top: 18px; padding: 14px; background: var(--laranja); color: #000; font-weight: 700; font-size: 1.05rem; }
  .principal:disabled { opacity: .6; cursor: wait; }
  .secundario { padding: 9px 14px; background: var(--cartao2); color: var(--texto); border: 1px solid var(--borda); }
  .item { padding: 12px 0; border-bottom: 1px solid var(--borda); }
  .item:last-child { border-bottom: 0; }
  .linha { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .desc { font-weight: 600; }
  .valor { white-space: nowrap; font-weight: 600; }
  .escolha { display: flex; gap: 8px; margin-top: 8px; }
  .escolha button { flex: 1; padding: 9px; background: var(--cartao2); color: var(--texto); border: 1px solid var(--borda); font-weight: 600; }
  .escolha button.sim[aria-pressed="true"] { background: var(--verde); border-color: var(--verde); color: #000; }
  .escolha button.nao[aria-pressed="true"] { background: var(--vermelho); border-color: var(--vermelho); color: #000; }
  .escolha button:focus-visible { outline: 2px solid var(--laranja); outline-offset: 2px; }
  .riscado .desc, .riscado .valor { text-decoration: line-through; color: var(--suave); }
  .etiqueta { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 700; color: #000; }

  .rapido { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  footer { text-align: center; color: var(--suave); font-size: .85rem; padding: 0 16px 32px; }
</style>

<footer>Dúvidas sobre algum item? Fale com a oficina pelo WhatsApp antes de responder.</footer>

<script>
const SUPABASE = "https://sgzcsdsdjuspcdaxxggb.supabase.co";
const CHAVE = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNnemNzZHNkanVzcGNkYXh4Z2diIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NjI0MTUsImV4cCI6MjEwODQzODQxNX0.0LobydfLKEfC9XZdBGOIN88ycAapcEosOxLHa3rz1Yg";
const $ = (id) => document.getElementById(id);
const reais = (v) => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const qtd = (v) => Number(v || 0).toLocaleString("pt-BR", { maximumFractionDigits: 3 });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const token = new URLSearchParams(location.search).get("t") || "";
let dados = null, resposta = {}, enviado = false;

async function rpc(funcao, corpo) {
  const r = await fetch(`${SUPABASE}/rest/v1/rpc/${funcao}`, {
    method: "POST",
    headers: { apikey: CHAVE, Authorization: `Bearer ${CHAVE}`, "Content-Type": "application/json" },
    body: JSON.stringify(corpo),
  });
  if (!r.ok) throw new Error("Não foi possível falar com a oficina agora. Tente de novo em instantes.");
  return r.json();
}

function erro(msg) {
  $("carregando").hidden = false;
  $("carregando").innerHTML = `<h2>Não foi possível abrir</h2><p class="erro">${esc(msg)}</p>`;
  $("conteudo").hidden = true;
}

function pendentes() { return dados.itens.filter((i) => i.aprovacao === "pendente"); }

function totalPrevisto() {
  return dados.itens.reduce((s, i) => s + (i.aprovacao === "pendente" && resposta[i.id] === false ? 0 : Number(i.subtotal)), 0) - Number(dados.desconto || 0);
}

function linhaItem(i) {
  const pend = i.aprovacao === "pendente" && dados.pode_aprovar;
  const recusado = pend && resposta[i.id] === false;
  const semCobrar = i.situacao && i.situacao !== "normal";
  return `<div class="item${recusado ? " riscado" : ""}">
    <div class="linha"><span class="desc">${esc(i.descricao)}</span><span class="valor">${semCobrar ? "sem custo" : reais(i.subtotal)}</span></div>
    <p class="meta">${qtd(i.quantidade)} × ${reais(i.valor)}${pend ? "" : " · <span class=\"etiqueta\" style=\"background:var(--verde)\">Aprovado</span>"}</p>
    ${pend ? `<div class="escolha" role="group" aria-label="Resposta para ${esc(i.descricao)}">
      <button type="button" class="sim" aria-pressed="${resposta[i.id] === true}" data-id="${i.id}" data-v="1">Aprovo</button>
      <button type="button" class="nao" aria-pressed="${resposta[i.id] === false}" data-id="${i.id}" data-v="0">Não quero</button>
    </div>` : ""}
  </div>`;
}

function mostrar(msg) {
  $("carregando").hidden = true;
  const c = $("conteudo");
  c.hidden = false;
  const pend = dados.pode_aprovar ? pendentes() : [];
  const servicos = dados.itens.filter((i) => i.tipo === "S"), pecas = dados.itens.filter((i) => i.tipo === "P");
  const faltam = pend.filter((i) => resposta[i.id] === undefined).length;
  c.innerHTML = `
    ${msg ? `<div class="ok" role="status">${esc(msg)}</div>` : ""}
    <section class="cartao">
      <h2>Olá${dados.cliente ? ", " + esc(dados.cliente) : ""}!</h2>
      <p class="meta">OS #${dados.numero}${dados.veiculo ? " · " + esc(dados.veiculo) : ""}</p>
      ${!dados.pode_aprovar ? `<p class="erro">Esta OS já foi encerrada; não é mais possível responder por aqui.</p>`
        : pend.length ? `<p class="meta">Toque em <b>Aprovo</b> ou <b>Não quero</b> em cada item e depois em <b>Enviar resposta</b>.</p>
          <div class="rapido"><button type="button" class="secundario" id="todos">Aprovar todos</button></div>`
        : `<p class="meta">Todos os itens já foram respondidos. Obrigado!</p>`}
      ${servicos.length ? `<h3>Serviços</h3>${servicos.map(linhaItem).join("")}` : ""}
      ${pecas.length ? `<h3>Peças</h3>${pecas.map(linhaItem).join("")}` : ""}
      ${Number(dados.desconto) > 0 ? `<div class="linha" style="margin-top:12px"><span>Desconto</span><span class="valor">− ${reais(dados.desconto)}</span></div>` : ""}
      <div class="total"><span>Total${pend.length ? " previsto" : ""}</span><span>${reais(Math.max(0, totalPrevisto()))}</span></div>
      ${pend.length ? `<button type="button" class="principal" id="enviar" ${faltam ? "disabled style=\"cursor:not-allowed\"" : ""}>
        ${faltam ? `Responda ${faltam === 1 ? "1 item" : faltam + " itens"} para enviar` : "Enviar resposta"}</button>
        <p class="erro" id="erro-envio" role="alert"></p>` : ""}
    </section>
    ${dados.recusados.length ? `<section class="cartao"><h2>Itens que você não aprovou</h2>
      ${dados.recusados.map((r) => `<div class="item riscado"><div class="linha"><span class="desc">${esc(r.descricao)}</span><span class="valor">${reais(r.subtotal)}</span></div></div>`).join("")}
      <p class="meta">Mudou de ideia? Fale com a oficina pelo WhatsApp.</p></section>` : ""}`;
  c.querySelectorAll(".escolha button").forEach((b) => b.addEventListener("click", () => {
    resposta[b.dataset.id] = b.dataset.v === "1";
    mostrar();
  }));
  const todos = $("todos");
  if (todos) todos.addEventListener("click", () => { pend.forEach((i) => (resposta[i.id] = true)); mostrar(); });
  const enviar = $("enviar");
  if (enviar && !faltam) enviar.addEventListener("click", enviarResposta);
}

async function enviarResposta() {
  const b = $("enviar");
  b.disabled = true;
  b.textContent = "Enviando…";
  const pend = pendentes();
  try {
    const r = await rpc("portal_aprovar", {
      p_token: token,
      p_aprovados: pend.filter((i) => resposta[i.id] === true).map((i) => i.id),
      p_recusados: pend.filter((i) => resposta[i.id] === false).map((i) => i.id),
    });
    if (r.erro) throw new Error(r.erro);
    dados = r;
    resposta = {};
    mostrar("Resposta enviada! A oficina já recebeu e vai seguir com os itens aprovados.");
    window.scrollTo(0, 0);
  } catch (e) {
    b.disabled = false;
    b.textContent = "Enviar resposta";
    $("erro-envio").textContent = e.message;
  }
}

(async () => {
  if (!/^[0-9a-f-]{36}$/i.test(token)) return erro("Link incompleto. Abra de novo o link que a oficina mandou pelo WhatsApp.");
  try {
    const r = await rpc("portal_itens", { p_token: token });
    if (r.erro) return erro(r.erro);
    dados = r;
    mostrar();
  } catch (e) { erro(e.message); }
})();
</script>
</body>
</html>
